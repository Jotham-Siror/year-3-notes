<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" width="660" height="560" font-family="Georgia, 'Times New Roman', serif">
<title>BEE 3101 End of Semester (25 Oct 2024) — Fig.1Q5: finite-difference mesh over an L-shaped region</title>
<desc>A square finite-difference mesh, 0.5 m pitch, over an L-shaped region 2 m wide and 2.5 m tall. The top three rows span the full width; below them only the right-hand half continues for two more rows. Eight free nodes are marked and numbered in column-major order: 1 and 2 in the left interior column, 3 and 4 in the middle, and 5, 6, 7, 8 down the right-hand interior column. Three boundary potentials are indicated: 20 V pointing down onto the top edge, 30 V pointing left onto the right edge, and 0 V pointing up onto the bottom edge of the left portion. The remaining boundary segments carry no potential on the paper. Required: the potentials at the eight free nodes, by iteration.</desc>
<style>
  .mesh{fill:none;stroke:#8d6e7a;stroke-width:1}
  .outline{fill:none;stroke:#6b4a58;stroke-width:2.2;stroke-linejoin:round}
  .node{fill:#5c3a48}
  .num{font-size:17px;fill:#333}
  .bv{font-size:17px;fill:#333}
  .arr{stroke:#6b4a58;stroke-width:1.6;fill:none}
  .dim{stroke:#6b4a58;stroke-width:1.4;fill:none}
  .dimtxt{font-size:16px;fill:#333}
  .hatch{stroke:#6b4a58;stroke-width:1.6}
  .figlab{font-size:14px;fill:#555;font-style:italic}
  .cap{font-size:12.5px;fill:#555}
</style>
<defs>
  <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#6b4a58"/></marker>
</defs>

<!-- mesh: upper block spans the full width, lower block only the right-hand half -->
<g class="mesh">
  <line x1="200" y1="90" x2="200" y2="294"/><line x1="268" y1="90" x2="268" y2="294"/>
  <line x1="336" y1="90" x2="336" y2="294"/><line x1="404" y1="90" x2="404" y2="294"/>
  <line x1="472" y1="90" x2="472" y2="294"/>
  <line x1="200" y1="90" x2="472" y2="90"/>
  <line x1="200" y1="158" x2="472" y2="158"/>
  <line x1="200" y1="226" x2="472" y2="226"/>
  <line x1="200" y1="294" x2="472" y2="294"/>
  <line x1="336" y1="294" x2="336" y2="430"/><line x1="404" y1="294" x2="404" y2="430"/>
  <line x1="472" y1="294" x2="472" y2="430"/>
  <line x1="336" y1="362" x2="472" y2="362"/>
  <line x1="336" y1="430" x2="472" y2="430"/>
</g>

<path d="M 200,90 L 472,90 L 472,430 L 336,430 L 336,294 L 200,294 Z" class="outline"/>

<!-- conducting-boundary ticks, as printed at three corners -->
<line x1="181" y1="71" x2="204" y2="94" class="hatch"/>
<line x1="468" y1="94" x2="491" y2="71" class="hatch"/>
<line x1="468" y1="426" x2="491" y2="449" class="hatch"/>

<!-- the eight free nodes -->
<circle cx="268" cy="158" r="4.5" class="node"/><text x="250" y="152" class="num">1</text>
<circle cx="268" cy="226" r="4.5" class="node"/><text x="250" y="220" class="num">2</text>
<circle cx="336" cy="158" r="4.5" class="node"/><text x="318" y="152" class="num">3</text>
<circle cx="336" cy="226" r="4.5" class="node"/><text x="318" y="220" class="num">4</text>
<circle cx="404" cy="158" r="4.5" class="node"/><text x="386" y="152" class="num">5</text>
<circle cx="404" cy="226" r="4.5" class="node"/><text x="386" y="220" class="num">6</text>
<circle cx="404" cy="294" r="4.5" class="node"/><text x="386" y="288" class="num">7</text>
<circle cx="404" cy="362" r="4.5" class="node"/><text x="386" y="356" class="num">8</text>

<!-- the three boundary potentials, exactly where the paper puts them -->
<line x1="336" y1="38" x2="336" y2="86" class="arr" marker-end="url(#ba)"/>
<text x="352" y="50" class="bv">20V</text>
<line x1="566" y1="190" x2="478" y2="190" class="arr" marker-end="url(#ba)"/>
<text x="578" y="196" class="bv">30V</text>
<line x1="268" y1="344" x2="268" y2="300" class="arr" marker-end="url(#ba)"/>
<text x="268" y="368" class="bv" text-anchor="middle">0 V</text>

<!-- overall dimensions -->
<line x1="140" y1="90" x2="140" y2="430" class="dim" marker-start="url(#ba)" marker-end="url(#ba)"/>
<text x="128" y="266" class="dimtxt" text-anchor="end">2.5 m</text>
<line x1="200" y1="486" x2="472" y2="486" class="dim" marker-start="url(#ba)" marker-end="url(#ba)"/>
<text x="336" y="478" class="dimtxt" text-anchor="middle">2 m</text>

<text x="330" y="514" class="figlab" text-anchor="middle">Fig.1Q5</text>
<text x="330" y="538" class="cap" text-anchor="middle">BEE 3101 End of Semester (25 Oct 2024), Q5(b) &#8212; to scale. Mesh pitch 0.5 m (not printed).</text>
<text x="330" y="554" class="cap" text-anchor="middle">Only three boundary segments carry a potential on the paper (erratum P13).</text>
</svg>
