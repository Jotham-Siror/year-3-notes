<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#222"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#1f6f8b"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>

  <!-- ============ panel 1 : eight D flip-flops sharing one clock ============ -->
  <rect x="40" y="70" width="760" height="170" fill="none" stroke="#222" stroke-width="2"/>

  <!-- flip-flop cells -->
  <g>
    <!-- bit 7 -->
    <rect x="80" y="95" width="105" height="85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="90"  y="118" font-size="14" fill="#222">D</text>
    <text x="175" y="118" font-size="14" text-anchor="end" fill="#222">Q</text>
    <text x="132" y="152" font-size="18" text-anchor="middle" fill="#222">0</text>
    <path d="M122,180 L142,180 L132,164 z" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="132" y1="180" x2="132" y2="212" stroke="#222" stroke-width="2"/>
    <line x1="98"  y1="30" x2="98"  y2="91" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <line x1="167" y1="95" x2="167" y2="30" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <text x="98"  y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">D7</text>
    <text x="167" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">Q7</text>
    <!-- bit 6 -->
    <rect x="250" y="95" width="105" height="85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="260" y="118" font-size="14" fill="#222">D</text>
    <text x="345" y="118" font-size="14" text-anchor="end" fill="#222">Q</text>
    <text x="302" y="152" font-size="18" text-anchor="middle" fill="#222">1</text>
    <path d="M292,180 L312,180 L302,164 z" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="302" y1="180" x2="302" y2="212" stroke="#222" stroke-width="2"/>
    <line x1="268" y1="30" x2="268" y2="91" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <line x1="337" y1="95" x2="337" y2="30" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <text x="268" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">D6</text>
    <text x="337" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">Q6</text>
    <!-- bit 5 -->
    <rect x="420" y="95" width="105" height="85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="430" y="118" font-size="14" fill="#222">D</text>
    <text x="515" y="118" font-size="14" text-anchor="end" fill="#222">Q</text>
    <text x="472" y="152" font-size="18" text-anchor="middle" fill="#222">1</text>
    <path d="M462,180 L482,180 L472,164 z" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="472" y1="180" x2="472" y2="212" stroke="#222" stroke-width="2"/>
    <line x1="438" y1="30" x2="438" y2="91" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <line x1="507" y1="95" x2="507" y2="30" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <text x="438" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">D5</text>
    <text x="507" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">Q5</text>
    <!-- ellipsis -->
    <text x="585" y="145" font-size="26" text-anchor="middle" fill="#222">&#8230;</text>
    <!-- bit 0 -->
    <rect x="650" y="95" width="105" height="85" fill="none" stroke="#222" stroke-width="2"/>
    <text x="660" y="118" font-size="14" fill="#222">D</text>
    <text x="745" y="118" font-size="14" text-anchor="end" fill="#222">Q</text>
    <text x="702" y="152" font-size="18" text-anchor="middle" fill="#222">1</text>
    <path d="M692,180 L712,180 L702,164 z" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="702" y1="180" x2="702" y2="212" stroke="#222" stroke-width="2"/>
    <line x1="668" y1="30" x2="668" y2="91" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <line x1="737" y1="95" x2="737" y2="30" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)"/>
    <text x="668" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">D0</text>
    <text x="737" y="22" font-size="14" text-anchor="middle" fill="#1f6f8b">Q0</text>
  </g>

  <!-- common clock bus -->
  <line x1="132" y1="212" x2="702" y2="212" stroke="#222" stroke-width="2"/>
  <line x1="417" y1="278" x2="417" y2="212" stroke="#222" stroke-width="2"/>
  <text x="417" y="298" font-size="16" text-anchor="middle" fill="#222">Clock</text>
  <text x="417" y="318" font-size="13" text-anchor="middle" fill="#666">all eight cells are loaded on the same clock edge</text>

  <!-- ============ panel 2 : the stored word ============ -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="240" y="336" width="360" height="42"/>
    <line x1="285" y1="336" x2="285" y2="378"/><line x1="330" y1="336" x2="330" y2="378"/>
    <line x1="375" y1="336" x2="375" y2="378"/><line x1="420" y1="336" x2="420" y2="378"/>
    <line x1="465" y1="336" x2="465" y2="378"/><line x1="510" y1="336" x2="510" y2="378"/>
    <line x1="555" y1="336" x2="555" y2="378"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#222">
    <text x="262" y="365">0</text><text x="307" y="365">1</text><text x="352" y="365">1</text>
    <text x="397" y="365">0</text><text x="442" y="365">1</text><text x="487" y="365">0</text>
    <text x="532" y="365">1</text><text x="577" y="365">1</text>
  </g>
  <text x="232" y="365" font-size="13" text-anchor="end" fill="#666">contents (Q7 &#8230; Q0)</text>

  <!-- ============ panel 3 : the register as one block ============ -->
  <rect x="150" y="440" width="540" height="80" fill="none" stroke="#222" stroke-width="2"/>
  <text x="420" y="488" font-size="20" text-anchor="middle" fill="#222">8-bit Register</text>
  <g stroke="#1f6f8b" stroke-width="2" marker-end="url(#ahb)">
    <line x1="180" y1="412" x2="180" y2="436"/><line x1="212" y1="412" x2="212" y2="436"/>
    <line x1="244" y1="412" x2="244" y2="436"/><line x1="276" y1="412" x2="276" y2="436"/>
    <line x1="308" y1="412" x2="308" y2="436"/><line x1="340" y1="412" x2="340" y2="436"/>
    <line x1="372" y1="412" x2="372" y2="436"/><line x1="404" y1="412" x2="404" y2="436"/>
    <line x1="500" y1="440" x2="500" y2="414"/><line x1="527" y1="440" x2="527" y2="414"/>
    <line x1="554" y1="440" x2="554" y2="414"/><line x1="581" y1="440" x2="581" y2="414"/>
    <line x1="608" y1="440" x2="608" y2="414"/><line x1="635" y1="440" x2="635" y2="414"/>
    <line x1="662" y1="440" x2="662" y2="414"/><line x1="689" y1="440" x2="689" y2="414"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1f6f8b">
    <text x="180" y="406">D7</text><text x="212" y="406">D6</text><text x="244" y="406">D5</text><text x="276" y="406">D4</text>
    <text x="308" y="406">D3</text><text x="340" y="406">D2</text><text x="372" y="406">D1</text><text x="404" y="406">D0</text>
    <text x="500" y="406">Q7</text><text x="527" y="406">Q6</text><text x="554" y="406">Q5</text><text x="581" y="406">Q4</text>
    <text x="608" y="406">Q3</text><text x="635" y="406">Q2</text><text x="662" y="406">Q1</text><text x="689" y="406">Q0</text>
  </g>
  <path d="M405,520 L445,520 L425,504 z" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="425" y1="548" x2="425" y2="520" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
  <text x="452" y="545" font-size="15" fill="#222">Clock</text>
</svg>
