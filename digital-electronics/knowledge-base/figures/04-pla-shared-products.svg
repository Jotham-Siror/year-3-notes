<text x="445" y="600" font-size="12" text-anchor="middle" fill="#222222">The right OR gate forms F1&#8242; = AB + AC + BC + A&#8242;B&#8242;C&#8242;; its XOR is tied to 1, which inverts it to F1.</text>
<text x="445" y="620" font-size="12" text-anchor="middle" fill="#222222">The left OR gate forms F2 = AB + AC + BC directly; its XOR is tied to 0.</text>
<text x="445" y="640" font-size="12" text-anchor="middle" fill="#222222">Only four products are needed because AB, AC and BC serve both outputs.</text>

