<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" font-family="sans-serif">
<rect width="800" height="290" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222222"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a5fb4"/></marker></defs>
<text x="400" y="26" font-size="15" text-anchor="middle" fill="#222222">General structure of a combinational PLD</text>
<line x1="40" y1="90" x2="110" y2="90" stroke="#222222" stroke-width="1.6"/>
<path d="M 110 76.0 L 110 104.0 L 138 90 Z" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<line x1="142" y1="90" x2="220" y2="90" stroke="#222222" stroke-width="1.6"/>
<line x1="142" y1="104" x2="220" y2="104" stroke="#222222" stroke-width="1.6"/>
<line x1="40" y1="150" x2="110" y2="150" stroke="#222222" stroke-width="1.6"/>
<path d="M 110 136.0 L 110 164.0 L 138 150 Z" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<line x1="142" y1="150" x2="220" y2="150" stroke="#222222" stroke-width="1.6"/>
<line x1="142" y1="164" x2="220" y2="164" stroke="#222222" stroke-width="1.6"/>
<text x="40" y="80" font-size="12" text-anchor="start" fill="#222222">n input</text>
<text x="40" y="96" font-size="12" text-anchor="start" fill="#222222">lines</text>
<text x="108" y="60" font-size="12" text-anchor="start" fill="#222222">buffer / inverters</text>
<text x="60" y="124" font-size="13" text-anchor="start" fill="#222222">...</text>
<rect x="220" y="60" width="140" height="150" rx="0" fill="none" stroke="#222222" stroke-width="1.8"/>
<text x="290" y="128" font-size="14" text-anchor="middle" fill="#222222">AND array</text>
<text x="290" y="148" font-size="11" text-anchor="middle" fill="#222222">(programmable</text>
<text x="290" y="162" font-size="11" text-anchor="middle" fill="#222222">or fixed)</text>
<line x1="360" y1="90" x2="470" y2="90" stroke="#222222" stroke-width="1.6"/>
<line x1="360" y1="120" x2="470" y2="120" stroke="#222222" stroke-width="1.6"/>
<line x1="360" y1="150" x2="470" y2="150" stroke="#222222" stroke-width="1.6"/>
<line x1="360" y1="180" x2="470" y2="180" stroke="#222222" stroke-width="1.6"/>
<text x="415" y="50" font-size="12" text-anchor="middle" fill="#222222">p product-term lines</text>
<line x1="415" y1="56" x2="415" y2="84" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#ahb)"/>
<rect x="470" y="60" width="140" height="150" rx="0" fill="none" stroke="#222222" stroke-width="1.8"/>
<text x="540" y="138" font-size="14" text-anchor="middle" fill="#222222">OR array</text>
<line x1="610" y1="100" x2="700" y2="100" stroke="#222222" stroke-width="1.6"/>
<line x1="610" y1="140" x2="700" y2="140" stroke="#222222" stroke-width="1.6"/>
<line x1="610" y1="180" x2="700" y2="180" stroke="#222222" stroke-width="1.6"/>
<text x="706" y="106" font-size="12" text-anchor="start" fill="#222222">m output</text>
<text x="706" y="122" font-size="12" text-anchor="start" fill="#222222">lines</text>
<text x="660" y="152" font-size="13" text-anchor="start" fill="#222222">...</text>
<text x="400" y="250" font-size="12" text-anchor="middle" fill="#222222">Each input is available true and complemented; the AND array forms p product terms;</text>
<text x="400" y="268" font-size="12" text-anchor="middle" fill="#222222">the OR array sums them into m sum-of-product outputs.</text>

</svg>
