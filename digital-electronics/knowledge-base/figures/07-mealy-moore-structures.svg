<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="520" viewBox="0 0 1010 520" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4f72"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="15" text-anchor="start" fill="#1b4f72">Mealy machine</text>
  <rect x="140" y="60" width="120" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="200" y="96" font-size="12" text-anchor="middle" fill="#1a1a1a">Next-state</text>
  <text x="200" y="114" font-size="12" text-anchor="middle" fill="#1a1a1a">logic F</text>
  <rect x="350" y="60" width="120" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="410" y="92" font-size="12" text-anchor="middle" fill="#1a1a1a">State</text>
