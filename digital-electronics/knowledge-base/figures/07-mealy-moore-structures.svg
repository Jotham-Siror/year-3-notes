  <text x="410" y="134" font-size="10" text-anchor="middle" fill="#117a65">clock input</text>
  <rect x="560" y="60" width="110" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="615" y="96" font-size="12" text-anchor="middle" fill="#1a1a1a">Output</text>
  <text x="615" y="114" font-size="12" text-anchor="middle" fill="#1a1a1a">logic G</text>
  <path d="M50,88 L140,88" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="66" y="80" font-size="11" text-anchor="middle" fill="#1b4f72">inputs</text>
  <path d="M260,88 L350,88" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="305" y="78" font-size="10" text-anchor="middle" fill="#1b4f72">excitation</text>
  <path d="M470,88 L560,88" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="515" y="78" font-size="10" text-anchor="middle" fill="#1b4f72">current state</text>
  <path d="M670,88 L760,88" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="800" y="92" font-size="11" text-anchor="middle" fill="#1b4f72">outputs</text>
  <path d="M490,88 L490,180 L120,180 L120,122 L140,122" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <circle cx="490" cy="88" r="3.4" fill="#1a1a1a"/>
  <path d="M50,210 L410,210 L410,146" stroke="#117a65" stroke-width="1.6" fill="none"/>
