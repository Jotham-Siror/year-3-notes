  <path d="M90,88 L90,46 L600,46 L600,60" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <circle cx="90" cy="88" r="3.4" fill="#1a1a1a"/>
  <text x="680" y="180" font-size="11" text-anchor="start" fill="#117a65">Next state = F₁(current state, inputs)</text>
  <text x="680" y="198" font-size="11" text-anchor="start" fill="#117a65">Output = G₁(current state, inputs)</text>
  <text x="60" y="294" font-size="15" text-anchor="start" fill="#1b4f72">Moore machine</text>
  <rect x="140" y="320" width="120" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="200" y="356" font-size="12" text-anchor="middle" fill="#1a1a1a">Next-state</text>
  <text x="200" y="374" font-size="12" text-anchor="middle" fill="#1a1a1a">logic F</text>
  <rect x="350" y="320" width="120" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="410" y="352" font-size="12" text-anchor="middle" fill="#1a1a1a">State</text>
  <text x="410" y="370" font-size="12" text-anchor="middle" fill="#1a1a1a">memory</text>
  <text x="410" y="394" font-size="10" text-anchor="middle" fill="#117a65">clock input</text>
  <rect x="560" y="320" width="110" height="86" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="615" y="356" font-size="12" text-anchor="middle" fill="#1a1a1a">Output</text>
  <text x="615" y="374" font-size="12" text-anchor="middle" fill="#1a1a1a">logic G</text>
