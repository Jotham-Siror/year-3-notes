  <text x="66" y="340" font-size="11" text-anchor="middle" fill="#1b4f72">inputs</text>
  <path d="M260,348 L350,348" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="305" y="338" font-size="10" text-anchor="middle" fill="#1b4f72">excitation</text>
  <path d="M470,348 L560,348" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="515" y="338" font-size="10" text-anchor="middle" fill="#1b4f72">current state</text>
  <path d="M670,348 L760,348" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="800" y="352" font-size="11" text-anchor="middle" fill="#1b4f72">outputs</text>
  <path d="M490,348 L490,440 L120,440 L120,382 L140,382" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <circle cx="490" cy="348" r="3.4" fill="#1a1a1a"/>
  <path d="M50,470 L410,470 L410,406" stroke="#117a65" stroke-width="1.6" fill="none"/>
  <text x="70" y="486" font-size="10" text-anchor="middle" fill="#117a65">clock signal</text>
  <text x="680" y="440" font-size="11" text-anchor="start" fill="#117a65">Next state = F₂(current state, inputs)</text>
  <text x="680" y="458" font-size="11" text-anchor="start" fill="#117a65">Output = G₂(current state)</text>
