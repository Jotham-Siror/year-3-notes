    <text x="725" y="112" text-anchor="middle">logic 1</text>
    <text x="725" y="212" fill="#8a4b00" text-anchor="middle">undefined</text>
    <text x="725" y="310" text-anchor="middle">logic 0</text>
    <text x="482" y="64">V_+</text>
    <text x="478" y="124">V_OH</text>
    <text x="478" y="294">V_OL</text>
    <text x="486" y="354">V_-</text>
    <text x="776" y="154">V_IH</text>
    <text x="776" y="254">V_IL</text>
    <text x="524" y="46" font-weight="bold">output</text>
    <text x="686" y="46" font-weight="bold">input</text>
