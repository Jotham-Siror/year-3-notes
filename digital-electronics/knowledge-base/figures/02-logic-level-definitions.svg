    <text x="404" y="355">v_I</text>
    <text x="34" y="96">V_OH</text>
    <text x="44" y="82">V_H</text>
    <text x="36" y="308">V_OL</text>
    <text x="46" y="322">V_L</text>
    <text x="100" y="368">V_L</text>
    <text x="138" y="368">V_IL</text>
    <text x="234" y="368">V_IH</text>
    <text x="320" y="368">V_H</text>
    <text x="200" y="140" fill="#1f4e79">slope = -1</text>
    <text x="250" y="270" fill="#1f4e79">slope = -1</text>
    <text x="212" y="188" fill="#0b7a5b">high-gain</text>
    <text x="212" y="204" fill="#0b7a5b">transition</text>
    <text x="120" y="396" font-weight="bold">(a) voltage transfer characteristic</text>
  </g>
  <!-- right panel: level bands -->
  <g stroke="#222222" fill="none" stroke-width="1.6">
