<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="sans-serif">
  <rect width="820" height="420" fill="#ffffff"/>
  <g stroke="#222222" fill="none" stroke-width="1.6">
    <!-- left panel: voltage transfer characteristic -->
    <line x1="80" y1="350" x2="400" y2="350"/>
    <line x1="80" y1="350" x2="80" y2="45"/>
    <path d="M 84 82 L 150 92 C 176 99 184 148 198 196 C 212 244 220 296 246 304 L 392 320" stroke="#1f4e79" stroke-width="2.4"/>
  </g>
  <g stroke="#222222" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="80" y1="92" x2="150" y2="92"/>
    <line x1="150" y1="92" x2="150" y2="350"/>
    <line x1="80" y1="304" x2="246" y2="304"/>
    <line x1="246" y1="304" x2="246" y2="350"/>
    <line x1="80" y1="78" x2="110" y2="78"/>
    <line x1="80" y1="318" x2="330" y2="318"/>
    <line x1="330" y1="318" x2="330" y2="350"/>
    <line x1="110" y1="78" x2="110" y2="350"/>
  </g>
  <g font-size="13" fill="#222222">
