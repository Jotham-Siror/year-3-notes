  <g stroke="#222222" fill="none" stroke-width="1.6">
    <rect x="520" y="60" width="90" height="290"/>
    <rect x="680" y="60" width="90" height="290"/>
    <line x1="520" y1="120" x2="610" y2="120"/>
    <line x1="520" y1="290" x2="610" y2="290"/>
    <line x1="680" y1="150" x2="770" y2="150"/>
    <line x1="680" y1="250" x2="770" y2="250"/>
  </g>
  <g font-size="12.5" fill="#222222">
