<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#111111"/></marker></defs>

  <circle cx="150" cy="110" r="24" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="150" y="116" font-size="16" text-anchor="middle" fill="#111111">&#931;</text>
  <text x="122" y="98" font-size="13" fill="#111111">+</text>
  <text x="122" y="142" font-size="13" fill="#111111">&#8722;</text>
  <text x="150" y="66" font-size="12" text-anchor="middle" fill="#666666">summing point</text>

  <rect x="222" y="82" width="120" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="282" y="116" font-size="13.5" text-anchor="middle" fill="#111111">integrator</text>

  <rect x="400" y="82" width="120" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="460" y="108" font-size="13.5" text-anchor="middle" fill="#111111">1-bit</text>
  <text x="460" y="126" font-size="13.5" text-anchor="middle" fill="#111111">quantiser</text>

  <rect x="640" y="82" width="120" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="700" y="108" font-size="13.5" text-anchor="middle" fill="#111111">n-bit</text>
  <text x="700" y="126" font-size="13.5" text-anchor="middle" fill="#111111">counter</text>

  <rect x="800" y="82" width="110" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="855" y="116" font-size="13.5" text-anchor="middle" fill="#111111">latch</text>

  <rect x="330" y="230" width="130" height="52" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="395" y="262" font-size="13.5" text-anchor="middle" fill="#111111">1-bit DAC</text>

  <g stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M40 110 H124"/>
    <path d="M174 110 H218"/>
    <path d="M342 110 H396"/>
    <path d="M520 110 H636"/>
    <path d="M760 110 H796"/>
    <path d="M910 110 H948"/>
  </g>
  <circle cx="580" cy="110" r="3.5" fill="#111111"/>
  <path d="M580 110 V256 H464" fill="none" stroke="#a33b00" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M330 256 H150 V138" fill="none" stroke="#a33b00" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="40" y="94" font-size="13" fill="#111111">analogue in</text>
  <text x="186" y="98" font-size="12.5" fill="#a33b00">&#916;</text>
  <text x="540" y="98" font-size="12" fill="#666666">1-bit stream</text>
  <text x="948" y="72" font-size="13" text-anchor="end" fill="#111111">n-bit binary code out</text>
  <text x="240" y="300" font-size="12.5" fill="#a33b00">feedback: the DAC subtracts the quantised value, so the loop tracks the error</text>

  <text x="40" y="342" font-size="12.5" fill="#111111">The density of 1s in the stream is proportional to the input: over a 2ⁿ-clock window, +MAX gives 2ⁿ ones, mid-scale gives 2ⁿ&#8725;2, &#8722;MAX gives none.</text>
  <text x="40" y="366" font-size="12.5" fill="#666666">Counting the ones over that window and latching the total is what turns the stream into an n-bit parallel code.</text>
</svg>
