<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4f72"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="380.0" y="26" font-size="14" text-anchor="middle" fill="#1a1a1a">Serial adder — implementation (one D flip-flop holds the carry)</text>
  <rect x="400" y="90" width="190" height="130" rx="10" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="495" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">Combinational</text>
  <text x="495" y="150" font-size="13" text-anchor="middle" fill="#1a1a1a">logic</text>
  <text x="495" y="176" font-size="11" text-anchor="middle" fill="#117a65">z = a ⊕ b ⊕ s</text>
  <text x="495" y="194" font-size="11" text-anchor="middle" fill="#117a65">s′ = ab + bs + as</text>
  <rect x="160" y="90" width="90" height="120" rx="0" fill="#eef3f8" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="173" y="134.0" font-size="13" text-anchor="start" fill="#1a1a1a" font-style="italic">D</text>
  <path d="M160,170.8 L173,178.8 L160,186.8" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
  <text x="178" y="182.8" font-size="11" text-anchor="start" fill="#1a1a1a" font-style="italic">Clk</text>
  <text x="239" y="154.0" font-size="13" text-anchor="end" fill="#1a1a1a" font-style="italic">Q</text>
  <text x="205" y="78" font-size="11" text-anchor="middle" fill="#1b4f72">carry flip-flop</text>
  <path d="M310,120 L400,120" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="296" y="124" font-size="14" text-anchor="end" fill="#1a1a1a" font-style="italic">a</text>
  <path d="M310,150 L400,150" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="296" y="154" font-size="14" text-anchor="end" fill="#1a1a1a" font-style="italic">b</text>
  <path d="M250,130 L330,130 L330,190 L400,190" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="300" y="124" font-size="13" text-anchor="start" fill="#1a1a1a" font-style="italic">s</text>
  <text x="300" y="112" font-size="10" text-anchor="start" fill="#1b4f72">current state</text>
  <path d="M590,155 L640,155 L640,262 L120,262 L120,130 L160,130" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="370" y="278" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">s′</text>
  <text x="392" y="278" font-size="10" text-anchor="start" fill="#1b4f72">next state</text>
  <path d="M590,120 L690,120" stroke="#1a1a1a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="706" y="124" font-size="14" text-anchor="start" fill="#1a1a1a" font-style="italic">z</text>
  <path d="M60,312 L205,312 L205,210" stroke="#117a65" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="46" y="316" font-size="11" text-anchor="end" fill="#117a65">Clock</text>
</svg>
