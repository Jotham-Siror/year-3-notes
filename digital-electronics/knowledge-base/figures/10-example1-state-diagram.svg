<svg xmlns="http://www.w3.org/2000/svg" width="900" height="415" viewBox="0 0 900 415" font-family="sans-serif">
  <rect width="900" height="415" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#111111"/></marker><marker id="ara" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5c8a"/></marker></defs>
  <circle cx="150" cy="240" r="34" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="150" y="245" font-size="13.5" text-anchor="middle" fill="#111111">T₀</text>
  <circle cx="450" cy="240" r="34" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="450" y="245" font-size="13.5" text-anchor="middle" fill="#111111">T₁</text>
  <circle cx="760" cy="240" r="34" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="760" y="245" font-size="13.5" text-anchor="middle" fill="#111111">T₂</text>
  <path d="M119.4 254.9 A27 27 0 1 1 119.4 225.1" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="48.0" y="244.0" font-size="12" text-anchor="middle" fill="#0b5c8a">S = 0</text>
  <path d="M435.1 209.4 A27 27 0 1 1 464.9 209.4" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450.0" y="142.0" font-size="12" text-anchor="middle" fill="#0b5c8a">A₃ = 0</text>
  <path d="M464.9 270.6 A27 27 0 1 1 435.1 270.6" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="450.0" y="346.0" font-size="12" text-anchor="middle" fill="#0b5c8a">A₃A₄ = 10</text>
  <path d="M184 240 L414 240" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="300" y="228" font-size="12" text-anchor="middle" fill="#0b5c8a">S = 1</text>
  <path d="M484 240 L724 240" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="604" y="228" font-size="12" text-anchor="middle" fill="#0b5c8a">A₃A₄ = 11</text>
  <path d="M740 212 A330 330 0 0 0 170 214" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="240" y="86" font-size="12" text-anchor="middle" fill="#0b5c8a">unconditional</text>
  <text x="450" y="356" font-size="12" text-anchor="middle" fill="#666666">T₀:  if S = 1 then A ← 0, F ← 0</text>
  <text x="450" y="374" font-size="12" text-anchor="middle" fill="#666666">T₁:  A ← A + 1;  if A₃ = 1 then E ← 1  else E ← 0</text>
  <text x="450" y="392" font-size="12" text-anchor="middle" fill="#666666">T₂:  F ← 1</text>
</svg>
