  <circle cx="490" cy="170" r="34" fill="#ffffff" stroke="#1b4f72" stroke-width="2.0"/>
  <text x="490" y="175" font-size="13" text-anchor="middle" fill="#1a1a1a">S1</text>
  <path d="M244.0,149.0 Q350.0,100.0 456.0,149.0" stroke="#1b4f72" stroke-width="1.7" fill="none"/>
