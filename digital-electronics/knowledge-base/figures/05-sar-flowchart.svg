<svg xmlns="http://www.w3.org/2000/svg" width="700" height="740" viewBox="0 0 700 740" font-family="sans-serif">
  <rect width="700" height="740" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#111111"/></marker></defs>
  <g fill="none" stroke="#111111" stroke-width="1.6">
    <ellipse cx="400" cy="42" rx="62" ry="24"/>
    <rect x="320" y="100" width="160" height="46" rx="4"/>
    <rect x="320" y="182" width="160" height="46" rx="4"/>
    <rect x="320" y="264" width="160" height="46" rx="4"/>
    <path d="M400 348 L510 410 L400 472 L290 410 Z"/>
    <rect x="80" y="386" width="150" height="46" rx="4"/>
