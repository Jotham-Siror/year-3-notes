<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" font-family="sans-serif">
  <rect width="980" height="340" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#111111"/></marker><marker id="ara" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5c8a"/></marker></defs>
  <text x="490" y="26" font-size="14.5" text-anchor="middle" fill="#111111">The three elements of an ASM chart</text>
  <path d="M150 60 L150 92" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="196" y="62" font-size="11.5" text-anchor="start" fill="#666666">state code (optional)</text>
  <rect x="80" y="92" width="140" height="56" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="150.0" y="116.61" font-size="13.5" text-anchor="middle" fill="#111111">state_name /</text>
  <text x="150.0" y="133.11" font-size="13.5" text-anchor="middle" fill="#111111">output list</text>
  <text x="226" y="87" font-size="12" text-anchor="start" fill="#0b5c8a">XXX</text>
  <path d="M150 148 L150 196" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="150" y="224" font-size="12.5" text-anchor="middle" fill="#666666">(a) state box</text>
  <text x="150" y="244" font-size="11" text-anchor="middle" fill="#666666">unconditional (Moore) outputs</text>
  <text x="150" y="260" font-size="11" text-anchor="middle" fill="#666666">exactly one exit path</text>
  <path d="M490 60 L490 96" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M490 96 L562 124 L490 152 L418 124 Z" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="490" y="128.68" font-size="13" text-anchor="middle" fill="#111111">condition</text>
  <path d="M418 124 L360 124 L360 196" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M562 124 L620 124 L620 196" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="392" y="116" font-size="12.5" text-anchor="middle" fill="#0b5c8a">1</text>
  <text x="590" y="116" font-size="12.5" text-anchor="middle" fill="#0b5c8a">0</text>
  <text x="360" y="214" font-size="11" text-anchor="middle" fill="#666666">true branch</text>
  <text x="624" y="214" font-size="11" text-anchor="middle" fill="#666666">false branch</text>
  <text x="490" y="244" font-size="12.5" text-anchor="middle" fill="#666666">(b) decision box</text>
  <text x="490" y="264" font-size="11" text-anchor="middle" fill="#666666">Boolean expression; two exit paths</text>
  <path d="M850 60 L850 96" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="755.0" y="99.0" width="190" height="50" rx="25.0" ry="25.0" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="850" y="128.32" font-size="12" text-anchor="middle" fill="#111111">conditional output list</text>
  <path d="M850 149 L850 196" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="850" y="224" font-size="12.5" text-anchor="middle" fill="#666666">(c) conditional output box</text>
  <text x="850" y="244" font-size="11" text-anchor="middle" fill="#666666">Mealy outputs: depend on state and inputs</text>
  <text x="850" y="260" font-size="11" text-anchor="middle" fill="#666666">list an output only when it is 1</text>
</svg>
