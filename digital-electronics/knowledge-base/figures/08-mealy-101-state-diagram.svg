<text x="330.0" y="226.79209282501594" text-anchor="middle" font-size="14" fill="#111111" >0/0</text>
<circle cx="130" cy="130" r="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="130" y="134.9" text-anchor="middle" font-size="14" fill="#111111">S0</text>
<circle cx="330" cy="130" r="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
