<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="sans-serif"><title>Mealy state diagram for the 101 sequence detector</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c6cab"/></marker><marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M54.0,130.0 L100.0,130.0" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="50.0" y="121.0" text-anchor="end" font-size="13" fill="#111111" >reset</text>
