<text x="790" y="330" font-size="13" fill="#777777">Completeness check: F + F′R + F′R′ = F + F′ = 1</text>
<text x="790" y="352" font-size="13" fill="#777777">Uniqueness check: F&#183;F′R = F&#183;F′R′ = F′R&#183;F′R′ = 0</text>
<text x="24" y="524" font-size="13" fill="#777777">F alone on an arc means F = 1 whatever R is; F′R means reverse only when forward is not asserted.</text>
