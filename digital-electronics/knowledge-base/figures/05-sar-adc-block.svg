<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="sans-serif">
  <rect width="980" height="430" fill="#ffffff"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#111111"/></marker></defs>

  <rect x="90" y="110" width="100" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="140" y="134" font-size="13.5" text-anchor="middle" fill="#111111">sample</text>
  <text x="140" y="152" font-size="13.5" text-anchor="middle" fill="#111111">and hold</text>

  <path d="M255 106 L255 170 L312 138 Z" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="265" y="127" font-size="14" fill="#111111">+</text>
  <text x="265" y="160" font-size="14" fill="#111111">&#8722;</text>
  <text x="283" y="192" font-size="13" text-anchor="middle" fill="#111111">comparator</text>

  <rect x="370" y="110" width="96" height="56" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="418" y="134" font-size="13.5" text-anchor="middle" fill="#111111">control</text>
  <text x="418" y="152" font-size="13.5" text-anchor="middle" fill="#111111">logic</text>

  <rect x="540" y="96" width="150" height="86" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="615" y="132" font-size="14" text-anchor="middle" fill="#111111">SAR</text>
  <text x="615" y="152" font-size="11.5" text-anchor="middle" fill="#666666">n-bit register</text>

  <rect x="540" y="290" width="150" height="60" rx="4" fill="none" stroke="#111111" stroke-width="1.6"/>
  <text x="615" y="316" font-size="13.5" text-anchor="middle" fill="#111111">n-bit DAC</text>
  <text x="615" y="336" font-size="11.5" text-anchor="middle" fill="#666666">weights the trial code</text>

  <g stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M20 138 H86"/>
    <path d="M190 122 H251"/>
    <path d="M312 138 H366"/>
    <path d="M466 138 H536"/>
    <path d="M615 182 V286"/>
    <path d="M615 60 V92"/>
    <path d="M690 139 H780"/>
  </g>
  <text x="24" y="128" font-size="13" fill="#111111">Vin</text>
  <text x="615" y="52" font-size="13" text-anchor="middle" fill="#111111">CLK</text>
  <text x="788" y="132" font-size="13" fill="#111111">parallel</text>
  <text x="788" y="150" font-size="13" fill="#111111">binary output</text>

  <path d="M540 320 H360 V154 H251" fill="none" stroke="#a33b00" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="392" y="308" font-size="13" fill="#a33b00">VDAC (feedback)</text>
  <path d="M900 320 H694" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="906" y="324" font-size="13" fill="#111111">VREF</text>
  <path d="M690 168 H740 V210 H780" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="788" y="214" font-size="12.5" fill="#666666">serial output</text>

  <text x="30" y="400" font-size="12" fill="#111111">Trial code from the SAR &#8594; DAC &#8594; comparator. If Vin &gt; VDAC the trial bit is kept, otherwise it is cleared; one clock per bit.</text>
