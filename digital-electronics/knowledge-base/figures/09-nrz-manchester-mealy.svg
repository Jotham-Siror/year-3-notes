<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="sans-serif">
<rect width="1240" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker></defs>
<text x="620.0" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">NRZ to Manchester — Mealy conversion machine (three states)</text>
<path d="M 373.5 164.1 Q 275.1 212.3 216.8 305.1" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="255.1" y="211.5" text-anchor="middle" font-size="14" fill="#1f6feb">1/1</text>
<path d="M 226.5 315.9 Q 324.9 267.7 383.2 174.9" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="348.9" y="272.5" text-anchor="middle" font-size="14" fill="#1f6feb">1/0</text>
<path d="M 416.8 174.9 Q 475.1 267.7 573.5 315.9" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="451.1" y="272.5" text-anchor="middle" font-size="14" fill="#1f6feb">0/0</text>
<path d="M 583.2 305.1 Q 524.9 212.3 426.5 164.1" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="544.9" y="211.5" text-anchor="middle" font-size="14" fill="#1f6feb">0/1</text>
<circle cx="400" cy="150" r="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="400" y="156" text-anchor="middle" font-size="17" fill="#111111">S₀</text>
<circle cx="600" cy="330" r="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600" y="336" text-anchor="middle" font-size="17" fill="#111111">S₁</text>
<circle cx="200" cy="330" r="30" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200" y="336" text-anchor="middle" font-size="17" fill="#111111">S₂</text>
<path d="M 322 104 L 367 150" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="318" y="109" text-anchor="end" font-size="13" fill="#777777">start</text>
<rect x="760" y="120" width="200" height="90" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="860" y="155" text-anchor="middle" font-size="14" fill="#111111">conversion</text>
<text x="860" y="177" text-anchor="middle" font-size="14" fill="#111111">network</text>
<path d="M 660 145 L 755 145" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 660 190 L 755 190" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 962 165 L 1050 165" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
<text x="655" y="140" text-anchor="end" font-size="13" fill="#1f6feb">NRZ data  X</text>
<text x="655" y="195" text-anchor="end" font-size="13" fill="#1f6feb">Clock2</text>
<text x="1055" y="170" font-size="13" fill="#1f6feb">Z (Manchester)</text>
<text x="760" y="280" font-size="13" fill="#111111">S₀ : first half of a bit cell</text>
<text x="760" y="304" font-size="13" fill="#111111">S₁ : second half of a 0 cell</text>
<text x="760" y="328" font-size="13" fill="#111111">S₂ : second half of a 1 cell</text>
<text x="760" y="372" font-size="13" fill="#777777">Blank entries in the table are don't-cares: X cannot</text>
<text x="760" y="392" font-size="13" fill="#777777">change inside a bit cell, so S₁ is only ever reached with</text>
<text x="760" y="412" font-size="13" fill="#777777">X = 0 and S₂ only with X = 1.</text>
<text x="24" y="454" font-size="13" fill="#777777">Clock2 runs at twice the bit rate, so each bit cell is two states long.</text>
</svg>