<text x="215" y="142" font-size="12.5" text-anchor="middle" fill="#a33b00">trial 1: bit3</text>
<text x="215" y="158" font-size="11.5" text-anchor="middle" fill="#666666">Vin > Vdac, so bit3 is kept</text>
<text x="425" y="142" font-size="12.5" text-anchor="middle" fill="#a33b00">trial 2: bit2</text>
<text x="425" y="158" font-size="11.5" text-anchor="middle" fill="#666666">Vdac > Vin, so bit2 is cleared</text>
<text x="635" y="142" font-size="12.5" text-anchor="middle" fill="#a33b00">trial 3: bit1</text>
<text x="635" y="158" font-size="11.5" text-anchor="middle" fill="#666666">Vdac > Vin, so bit1 is cleared</text>
<text x="845" y="142" font-size="12.5" text-anchor="middle" fill="#a33b00">trial 4: bit0</text>
<text x="845" y="158" font-size="11.5" text-anchor="middle" fill="#666666">Vdac > Vin, so bit0 is cleared</text>
<text x="950" y="270" font-size="13" text-anchor="middle" fill="#1a5fb4">final code 1000</text>
<text x="30" y="434" font-size="12.5" fill="#111111">Four-bit search for an input in 5.000 V &#8804; Vin &lt; 5.625 V (e.g. 5.3 V). One LSB = 0.625 V, so the DAC full scale is 16 &#215; 0.625 V = 10 V.</text>
<text x="30" y="454" font-size="12.5" fill="#a33b00">Crossed circles are the branches not taken. The deck prints the last one as 1010 / 6.25 V &#8212; see V05-3.</text>
