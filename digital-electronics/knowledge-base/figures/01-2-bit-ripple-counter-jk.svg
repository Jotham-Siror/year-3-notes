<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#222"/>
    </marker>
    <marker id="ahd" markerWidth="8" markerHeight="8" refX="4" refY="7.5" orient="auto">
      <path d="M0,0 L8,0 L4,8 z" fill="#b25400"/>
    </marker>
  </defs>
  <rect width="900" height="630" fill="#ffffff"/>

  <!-- ================= circuit ================= -->
  <g stroke="#222" stroke-width="2" fill="none">
    <rect x="170" y="60" width="150" height="170"/>
    <rect x="520" y="60" width="150" height="170"/>
  </g>
  <g font-size="17" fill="#222">
    <text x="182" y="106">J</text><text x="182" y="206">K</text>
    <text x="308" y="106" text-anchor="end">Q</text>
    <text x="308" y="212" text-anchor="end">Q</text>
    <text x="532" y="106">J</text><text x="532" y="206">K</text>
    <text x="658" y="106" text-anchor="end">Q</text>
    <text x="658" y="212" text-anchor="end">Q</text>
  </g>
  <g font-size="12" fill="#222">
    <text x="190" y="112">0</text><text x="190" y="212">0</text>
    <text x="540" y="112">1</text><text x="540" y="212">1</text>
    <text x="312" y="112">0</text><text x="312" y="218">0</text>
    <text x="662" y="112">1</text><text x="662" y="218">1</text>
  </g>
  <line x1="288" y1="196" x2="308" y2="196" stroke="#222" stroke-width="1.6"/>
  <line x1="638" y1="196" x2="658" y2="196" stroke="#222" stroke-width="1.6"/>

  <!-- clock inputs: bubble + dynamic indicator = negative edge -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="161" cy="150" r="8"/>
    <path d="M170,138 L170,162 L190,150 z"/>
    <circle cx="511" cy="150" r="8"/>
    <path d="M520,138 L520,162 L540,150 z"/>
  </g>
  <text x="196" y="156" font-size="16" font-style="italic" fill="#222">clk</text>
  <text x="546" y="156" font-size="16" font-style="italic" fill="#222">clk</text>

  <!-- logic 1 rail to J and K -->
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M75,285 L120,285 L120,100 L170,100"/>
    <path d="M120,200 L170,200"/>
    <path d="M120,285 L470,285 L470,100 L520,100"/>
    <path d="M470,200 L520,200"/>
  </g>
  <circle cx="68" cy="285" r="6" fill="none" stroke="#222" stroke-width="2"/>
  <text x="60" y="272" font-size="16" font-style="italic" text-anchor="middle" fill="#222">1</text>
  <circle cx="120" cy="285" r="4" fill="#222"/>

  <!-- pulses in -->
  <line x1="60" y1="150" x2="153" y2="150" stroke="#222" stroke-width="2"/>
  <text x="56" y="140" font-size="16" font-style="italic" text-anchor="end" fill="#222">pulses</text>

  <!-- Q0 out, and Q0 -> clk of MSB stage -->
  <path d="M320,100 L400,100 L400,38" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <path d="M400,100 L400,150 L503,150" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <circle cx="400" cy="100" r="4" fill="#1f6f8b"/>
  <circle cx="400" cy="32" r="6" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="400" y="20" font-size="16" text-anchor="middle" fill="#1f6f8b">Q0</text>
  <path d="M670,100 L790,100 L790,38" stroke="#1f6f8b" stroke-width="2" fill="none"/>
  <circle cx="790" cy="32" r="6" fill="none" stroke="#1f6f8b" stroke-width="2"/>
  <text x="790" y="20" font-size="16" text-anchor="middle" fill="#1f6f8b">Q1</text>

  <text x="245" y="256" font-size="15" font-style="italic" text-anchor="middle" fill="#666">(LSB)</text>
  <text x="595" y="256" font-size="15" font-style="italic" text-anchor="middle" fill="#666">(MSB)</text>
  <text x="245" y="316" font-size="13" text-anchor="middle" fill="#666">J = K = 1, so each stage toggles</text>
  <text x="595" y="316" font-size="13" text-anchor="middle" fill="#666">the MSB stage is clocked by Q0, not by the pulse train</text>

  <!-- ================= timing ================= -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="4,4">
    <line x1="230" y1="345" x2="230" y2="575"/><line x1="340" y1="345" x2="340" y2="575"/>
    <line x1="450" y1="345" x2="450" y2="575"/><line x1="560" y1="345" x2="560" y2="575"/>
    <line x1="670" y1="345" x2="670" y2="575"/><line x1="780" y1="345" x2="780" y2="575"/>
  </g>
  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="150,390 175,390 175,350 230,350 230,390 285,390 285,350 340,350 340,390 395,390 395,350 450,350 450,390 505,390 505,350 560,350 560,390 615,390 615,350 670,350 670,390 725,390 725,350 780,350 780,390 860,390"/>
    <polyline points="150,470 230,470 230,430 340,430 340,470 450,470 450,430 560,430 560,470 670,470 670,430 780,430 780,470 860,470"/>
    <polyline points="150,550 340,550 340,510 560,510 560,550 780,550 780,510 860,510"/>
  </g>
  <g font-size="16" text-anchor="end" fill="#222">
    <text x="140" y="376">clk</text><text x="140" y="456">Q0</text><text x="140" y="536">Q1</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#666">
    <text x="202" y="338">1</text><text x="312" y="338">2</text><text x="422" y="338">3</text>
    <text x="532" y="338">4</text><text x="642" y="338">5</text><text x="752" y="338">6</text>
  </g>
  <!-- falling-edge markers -->
  <g stroke="#b25400" stroke-width="2" marker-end="url(#ahd)">
    <line x1="230" y1="352" x2="230" y2="382"/><line x1="340" y1="352" x2="340" y2="382"/>
    <line x1="450" y1="352" x2="450" y2="382"/><line x1="560" y1="352" x2="560" y2="382"/>
    <line x1="670" y1="352" x2="670" y2="382"/><line x1="780" y1="352" x2="780" y2="382"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#222">
    <text x="190" y="600">00</text><text x="285" y="600">01</text><text x="395" y="600">10</text>
    <text x="505" y="600">11</text><text x="615" y="600">00</text><text x="725" y="600">01</text>
    <text x="820" y="600">10</text>
  </g>
  <text x="140" y="600" font-size="16" text-anchor="end" fill="#222">Q1Q0 =</text>
</svg>
