<text x="480" y="694" font-size="12" text-anchor="middle" fill="#222222">Product terms 3 and 6 keep every fuse intact, so each is A&#183;A&#8242;&#183;B&#183;B&#8242;&#8230; = 0 and adds nothing to its sum.</text>
<text x="480" y="716" font-size="12" text-anchor="middle" fill="#222222">Cross = link intact. The OR array is fixed: each OR gate is hard-wired to exactly three product terms.</text>

