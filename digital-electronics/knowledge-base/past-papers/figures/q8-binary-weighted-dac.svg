<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <g stroke="#222222" fill="none" stroke-width="1.7">

    <!-- D0 200k -->
    <circle cx="54" cy="80" r="5"/>
    <line x1="60" y1="80" x2="120" y2="80"/>
    <path d="M 120 80 l 6 -8 l 10 16 l 10 -16 l 10 16 l 10 -16 l 6 8"/>
    <line x1="172" y1="80" x2="330" y2="80"/>
    <line x1="330" y1="80" x2="330" y2="170"/>

    <!-- D1 100k -->
    <circle cx="54" cy="130" r="5"/>
    <line x1="60" y1="130" x2="120" y2="130"/>
    <path d="M 120 130 l 6 -8 l 10 16 l 10 -16 l 10 16 l 10 -16 l 6 8"/>
    <line x1="172" y1="130" x2="330" y2="130"/>
    <line x1="330" y1="130" x2="330" y2="170"/>

    <!-- D2 50k -->
    <circle cx="54" cy="180" r="5"/>
    <line x1="60" y1="180" x2="120" y2="180"/>
    <path d="M 120 180 l 6 -8 l 10 16 l 10 -16 l 10 16 l 10 -16 l 6 8"/>
    <line x1="172" y1="180" x2="330" y2="180"/>

    <!-- D3 25k -->
    <circle cx="54" cy="230" r="5"/>
    <line x1="60" y1="230" x2="120" y2="230"/>
    <path d="M 120 230 l 6 -8 l 10 16 l 10 -16 l 10 16 l 10 -16 l 6 8"/>
    <line x1="172" y1="230" x2="330" y2="230"/>
    <line x1="330" y1="230" x2="330" y2="180"/>

    <!-- summing node -->
    <circle cx="330" cy="180" r="3.5" fill="#222222"/>
    <line x1="330" y1="180" x2="400" y2="180"/>

    <!-- feedback Rf 10k -->
    <line x1="330" y1="180" x2="330" y2="60"/>
    <line x1="330" y1="60" x2="400" y2="60"/>
    <path d="M 400 60 l 6 -8 l 10 16 l 10 -16 l 10 16 l 10 -16 l 6 8"/>
    <line x1="452" y1="60" x2="530" y2="60"/>
    <line x1="530" y1="60" x2="530" y2="180"/>

    <!-- op-amp -->
    <polygon points="400,140 400,240 490,190" fill="none"/>
    <line x1="400" y1="220" x2="370" y2="220"/>
    <line x1="370" y1="220" x2="370" y2="270"/>
    <line x1="356" y1="270" x2="384" y2="270"/>
    <line x1="361" y1="276" x2="379" y2="276"/>
    <line x1="366" y1="282" x2="374" y2="282"/>

    <!-- output -->
    <line x1="490" y1="190" x2="620" y2="190"/>
    <circle cx="530" cy="190" r="3.5" fill="#222222"/>
    <circle cx="626" cy="190" r="5"/>
  </g>

  <g font-size="12.5" fill="#222222">
    <text x="126" y="70">200 k</text>
    <text x="126" y="120">100 k</text>
    <text x="130" y="170">50 k</text>
    <text x="130" y="220">25 k</text>
    <text x="410" y="46">Rf  10 k</text>
    <text x="24" y="84">D0</text>
    <text x="24" y="134">D1</text>
    <text x="24" y="184">D2</text>
    <text x="24" y="234">D3</text>
    <text x="410" y="186">-</text>
    <text x="410" y="226">+</text>
    <text x="584" y="182">Output</text>
  </g>

  <g font-size="11.5" fill="#1f4e79">
    <text x="24" y="98">LSB</text>
    <text x="24" y="248">MSB</text>
    <text x="40" y="320">Figure 2(a) - 4-bit binary-weighted-input DAC. Inputs swing 0 V (low) to +5 V (high).</text>
    <text x="40" y="338">Weights: D0 = -0.25 V, D1 = -0.50 V, D2 = -1.00 V, D3 = -2.00 V.</text>
    <text x="40" y="356">Vout = -Rf x sum(Vi / Ri) = -0.25 V x (decimal value of D3 D2 D1 D0).  Full scale 1111 = -3.75 V.</text>
  </g>
</svg>
