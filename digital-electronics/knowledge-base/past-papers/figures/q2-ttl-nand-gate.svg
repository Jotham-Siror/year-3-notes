<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <g stroke="#222222" fill="none" stroke-width="1.7">

    <!-- Vcc rail -->
    <line x1="100" y1="40" x2="640" y2="40"/>
    <circle cx="646" cy="40" r="5"/>

    <!-- R1 4k -->
    <line x1="190" y1="40" x2="190" y2="70"/>
    <path d="M 190 70 l 8 6 l -16 10 l 16 10 l -16 10 l 8 6"/>
    <line x1="190" y1="112" x2="190" y2="180"/>
    <circle cx="190" cy="40" r="3.5" fill="#222222"/>

    <!-- Q1 multi-emitter: base bar horizontal -->
    <line x1="152" y1="180" x2="232" y2="180"/>
    <!-- emitter 1 -->
    <line x1="168" y1="180" x2="148" y2="200"/>
    <polygon points="156,188 150,199 162,194" fill="#222222" stroke="none"/>
    <line x1="148" y1="200" x2="60" y2="200"/>
    <!-- emitter 2 -->
    <line x1="196" y1="180" x2="176" y2="200"/>
    <polygon points="184,188 178,199 190,194" fill="#222222" stroke="none"/>
    <line x1="176" y1="200" x2="176" y2="280"/>
    <line x1="176" y1="280" x2="60" y2="280"/>
    <!-- collector -->
    <line x1="220" y1="180" x2="245" y2="205"/>
    <line x1="245" y1="205" x2="245" y2="270"/>
    <line x1="245" y1="270" x2="310" y2="270"/>
    <circle cx="54" cy="200" r="5"/>
    <circle cx="54" cy="280" r="5"/>

    <!-- D1 clamp on input A -->
    <circle cx="100" cy="200" r="3.5" fill="#222222"/>
    <line x1="100" y1="200" x2="100" y2="222"/>
    <line x1="88" y1="222" x2="112" y2="222"/>
    <polygon points="88,244 112,244 100,222" fill="#222222" stroke="none"/>
    <line x1="100" y1="244" x2="100" y2="256"/>
    <line x1="86" y1="256" x2="114" y2="256"/>
    <line x1="91" y1="262" x2="109" y2="262"/>
    <line x1="96" y1="268" x2="104" y2="268"/>

    <!-- D2 clamp on input B -->
    <circle cx="100" cy="280" r="3.5" fill="#222222"/>
    <line x1="100" y1="280" x2="100" y2="302"/>
    <line x1="88" y1="302" x2="112" y2="302"/>
    <polygon points="88,324 112,324 100,302" fill="#222222" stroke="none"/>
    <line x1="100" y1="324" x2="100" y2="336"/>
    <line x1="86" y1="336" x2="114" y2="336"/>
    <line x1="91" y1="342" x2="109" y2="342"/>
    <line x1="96" y1="348" x2="104" y2="348"/>

    <!-- R3 1.6k -->
    <line x1="330" y1="40" x2="330" y2="180"/>
    <path d="M 330 180 l 8 6 l -16 10 l 16 10 l -16 10 l 8 6"/>
    <line x1="330" y1="222" x2="330" y2="245"/>
    <circle cx="330" cy="40" r="3.5" fill="#222222"/>

    <!-- Q2 phase splitter -->
    <line x1="310" y1="245" x2="310" y2="295"/>
    <line x1="310" y1="270" x2="245" y2="270"/>
    <line x1="310" y1="256" x2="330" y2="244"/>
    <line x1="310" y1="284" x2="330" y2="296"/>
    <polygon points="322,290 332,296 322,302" fill="#222222" stroke="none"/>
    <line x1="330" y1="296" x2="330" y2="350"/>
    <circle cx="330" cy="245" r="3.5" fill="#222222"/>
    <circle cx="330" cy="350" r="3.5" fill="#222222"/>

    <!-- R2 1.0k to ground -->
    <line x1="330" y1="350" x2="330" y2="378"/>
    <path d="M 330 378 l 8 6 l -16 10 l 16 10 l -16 10 l 8 6"/>
    <line x1="330" y1="420" x2="330" y2="436"/>
    <line x1="316" y1="436" x2="344" y2="436"/>
    <line x1="321" y1="442" x2="339" y2="442"/>
    <line x1="326" y1="448" x2="334" y2="448"/>

    <!-- R5 130 -->
    <line x1="530" y1="40" x2="530" y2="78"/>
    <path d="M 530 78 l 8 6 l -16 10 l 16 10 l -16 10 l 8 6"/>
    <line x1="530" y1="120" x2="530" y2="140"/>
    <circle cx="530" cy="40" r="3.5" fill="#222222"/>

    <!-- Q4 upper totem-pole -->
    <line x1="510" y1="145" x2="510" y2="195"/>
    <line x1="510" y1="170" x2="420" y2="170"/>
    <line x1="420" y1="170" x2="420" y2="245"/>
    <line x1="420" y1="245" x2="330" y2="245"/>
    <line x1="510" y1="156" x2="530" y2="144"/>
    <line x1="510" y1="184" x2="530" y2="196"/>
    <polygon points="522,190 532,196 522,202" fill="#222222" stroke="none"/>
    <line x1="530" y1="196" x2="530" y2="222"/>

    <!-- D3 -->
    <polygon points="518,222 542,222 530,244" fill="#222222" stroke="none"/>
    <line x1="518" y1="244" x2="542" y2="244"/>
    <line x1="530" y1="244" x2="530" y2="290"/>

    <!-- output node -->
    <circle cx="530" cy="290" r="3.5" fill="#222222"/>
    <line x1="530" y1="290" x2="646" y2="290"/>
    <circle cx="652" cy="290" r="5"/>

    <!-- Q3 lower totem-pole -->
    <line x1="530" y1="290" x2="530" y2="320"/>
    <line x1="510" y1="325" x2="510" y2="375"/>
    <line x1="510" y1="350" x2="330" y2="350"/>
    <line x1="510" y1="336" x2="530" y2="324"/>
    <line x1="510" y1="364" x2="530" y2="376"/>
    <polygon points="522,370 532,376 522,382" fill="#222222" stroke="none"/>
    <line x1="530" y1="376" x2="530" y2="410"/>
    <line x1="516" y1="410" x2="544" y2="410"/>
    <line x1="521" y1="416" x2="539" y2="416"/>
    <line x1="526" y1="422" x2="534" y2="422"/>
  </g>

  <g font-size="12.5" fill="#222222">
    <text x="200" y="96">R1  4 k</text>
    <text x="340" y="206">R3  1.6 k</text>
    <text x="540" y="104">R5  130</text>
    <text x="340" y="404">R2  1.0 k</text>
    <text x="656" y="44">+Vcc</text>
    <text x="240" y="176">Q1</text>
    <text x="286" y="240">Q2</text>
    <text x="486" y="140">Q4</text>
    <text x="486" y="392">Q3</text>
    <text x="546" y="238">D3</text>
    <text x="118" y="240">D1</text>
    <text x="118" y="320">D2</text>
    <text x="20" y="204">A</text>
    <text x="20" y="284">B</text>
    <text x="600" y="282">Output</text>
  </g>

  <g font-size="12" fill="#1f4e79">
    <text x="40" y="486">Figure 1 - two-input TTL NAND (7400 stage). Q1 multi-emitter input, Q2 phase splitter,</text>
    <text x="40" y="502">Q4 / D3 / Q3 totem-pole output. Both inputs HIGH is the only case that pulls the output LOW.</text>
  </g>
</svg>
