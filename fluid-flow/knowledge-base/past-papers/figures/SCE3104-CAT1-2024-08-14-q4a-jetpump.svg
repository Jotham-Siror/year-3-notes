<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 470" width="790" height="470" font-family="Georgia, 'Times New Roman', serif">
<title>SCE 3104 CAT 1 (14 Aug 2024) — Q4a: jet pump discharging into a larger pipe</title>
<desc>A jet of diameter d issues at velocity v0 into a surrounding stream of velocity v1 and pressure p1 inside a pipe of diameter D (Section 1). Downstream the flow is fully mixed and uniform at velocity v2 and pressure p2 (Section 2). In this question the jet radius is 3 cm, the jet velocity 8.9 m/s, the pipe radius 8 cm and the surrounding stream 6.3 m/s.</desc>
