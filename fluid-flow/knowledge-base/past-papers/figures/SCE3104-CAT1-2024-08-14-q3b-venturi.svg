<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Georgia, 'Times New Roman', serif">
<title>SCE 3104 CAT 1 (14 Aug 2024) — Q3b: Venturi tube</title>
<desc>A horizontal Venturi tube: inlet of area A1 where the velocity is v1 and the pressure p1, a contracted throat of area A2 where the velocity is v2 and the pressure p2, and a gradual diffuser back to the original bore. Two piezometer tubes, one at the inlet and one at the throat, show a difference in liquid level H between them. In this question the inlet and throat diameters are 7 cm and 2 cm and H is 20 cm.</desc>
