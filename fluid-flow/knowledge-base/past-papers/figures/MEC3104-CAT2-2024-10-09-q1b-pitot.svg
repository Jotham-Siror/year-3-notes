<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
<title>MEC 3104 CAT 2 (9 Oct 2024) — Q1(b): Pitot tube on a water pipe</title>
<desc>A horizontal water pipe carries two open vertical tubes. The left, straight tube is a static (piezometer) limb; its column stands 15.5 above the pipe centreline, and it meets the pipe at point A. The right tube is the Pitot limb: it descends into the pipe and bends through 90 degrees so that its opening, point B, faces to the left; its column stands 18.6 above the centreline. Both dimensions are printed with a foot mark, but the paper's note says the dimensions are in inches. The column heights are drawn to scale relative to one another; the pipe itself is schematic. Required: the water velocity at the centre of the pipe, from v = Cf sqrt(2gh) with Cf = 0.98.</desc>
<style>
  .wall{fill:none;stroke:#1a1a1a;stroke-width:2.6;stroke-linejoin:round}
  .fluidfill{fill:#dbe8f2}
  .tube{fill:none;stroke:#1a1a1a;stroke-width:12;stroke-linejoin:round;stroke-linecap:butt}
  .bore{fill:none;stroke:#dbe8f2;stroke-width:7;stroke-linejoin:round;stroke-linecap:butt}
  .dim{stroke:#444;stroke-width:1.1;fill:none}
  .ext{stroke:#999;stroke-width:0.8;stroke-dasharray:3 2}
  .dimtxt{font-size:16px;fill:#222}
  .lab{font-size:16px;fill:#111;font-style:italic}
  .fluid{font-size:15px;fill:#1a4a72}
  .surf{stroke:#1a4a72;stroke-width:1.6}
  .cap{font-size:12.5px;fill:#555}
  .cl{stroke:#666;stroke-width:1;stroke-dasharray:9 3 2 3;fill:none}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker>
</defs>

<!-- pipe body, filled with water -->
<path d="M 95,318 L 605,318 A 16,42 0 0 1 605,402 L 95,402 A 16,42 0 0 1 95,318 Z" class="fluidfill"/>
<text x="150" y="386" class="fluid">Water</text>

<!-- the two limbs: solid tube wall, then the bore, then the air above each column -->
<path d="M 300,130 L 300,392" class="tube"/>
<path d="M 430,88 L 430,358 Q 430,392 396,392 L 352,392" class="tube"/>
<path d="M 300,133 L 300,389" class="bore"/>
<path d="M 430,91 L 430,358 Q 430,389 396,389 L 355,389" class="bore"/>
<rect x="294" y="128" width="12" height="30.5" fill="#ffffff"/>
<rect x="424" y="86" width="12" height="32.2" fill="#ffffff"/>
<line x1="294" y1="158.5" x2="306" y2="158.5" class="surf"/>
<line x1="424" y1="118.2" x2="436" y2="118.2" class="surf"/>

<!-- pipe outline drawn over the limbs so the walls read as continuous -->
<path d="M 95,318 L 605,318" class="wall"/>
<path d="M 95,402 L 605,402" class="wall"/>
<path d="M 605,318 A 16,42 0 0 1 605,402" class="wall"/>
<ellipse cx="95" cy="360" rx="16" ry="42" class="wall"/>

<!-- pipe centreline: both dimensions are measured from it -->
<line x1="45" y1="360" x2="655" y2="360" class="cl"/>

<!-- station labels -->
<text x="278" y="382" class="lab">A</text>
<text x="358" y="382" class="lab">B</text>

<!-- 15.5 on the static limb -->
<line x1="246" y1="158.5" x2="296" y2="158.5" class="ext"/>
<line x1="246" y1="360" x2="292" y2="360" class="ext"/>
<line x1="252" y1="158.5" x2="252" y2="360" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="240" y="264" class="dimtxt" text-anchor="end">15.5&#8242;</text>

<!-- 18.6 on the Pitot limb -->
<line x1="436" y1="118.2" x2="506" y2="118.2" class="ext"/>
<line x1="440" y1="360" x2="506" y2="360" class="ext"/>
<line x1="498" y1="118.2" x2="498" y2="360" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="510" y="244" class="dimtxt">18.6&#8242;</text>

<text x="350" y="446" class="cap" text-anchor="middle">MEC 3104 CAT 2 (9 Oct 2024), Q1(b). Column heights to scale; the pipe is schematic.</text>
<text x="350" y="462" class="cap" text-anchor="middle">Dimensions carry the foot mark &#8242; as printed; the paper&#8217;s note says inches (erratum P16).</text>
</svg>
