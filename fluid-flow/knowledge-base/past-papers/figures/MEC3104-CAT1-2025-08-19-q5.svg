<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 478" width="809" height="478" font-family="Georgia, 'Times New Roman', serif">
<title>MEC 3104 CAT 1 (19 Aug 2025) — Q5: inclined gate AB in an oil tank</title>
<desc>Oil tank, s.g. 0.81. Free surface 8 m wide; left wall 7 m deep; right wall vertical 3 m from the surface to the top of a wall inclined at 50 degrees to the horizontal. Gate AB (1.0 m long by 0.9 m wide) lies on the incline, starting 1 m along the incline from its top. F is the resultant pressure force, normal to the gate; X locates its centre of pressure along the gate.</desc>
