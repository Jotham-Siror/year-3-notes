  .lab{font-size:16px;fill:#111;font-style:italic}
  .fluid{font-size:15px;fill:#1a4a72}
  .gate{stroke:#111;stroke-width:9;stroke-linecap:butt}
  .gate2{stroke:#f2c14e;stroke-width:5;stroke-linecap:butt}
  .force{stroke:#b3261e;stroke-width:2.2;fill:none}
  .cap{font-size:13px;fill:#555}
  .cl{stroke:#666;stroke-width:1;stroke-dasharray:9 3 2 3;fill:none}
</style>
