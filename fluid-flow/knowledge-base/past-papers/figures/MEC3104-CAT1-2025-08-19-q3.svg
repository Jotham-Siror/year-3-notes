<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 466" width="703" height="466" font-family="Georgia, 'Times New Roman', serif">
<title>MEC 3104 CAT 1 (19 Aug 2025) — Q3: can floating in water</title>
<desc>An open can of diameter 8 cm floats in water. 4 cm of its height stands above the waterline and 7 cm is submerged, so the can is 11 cm tall overall. Required: the weight of the can.</desc>
<style>
  .wall{fill:none;stroke:#1a1a1a;stroke-width:2.6;stroke-linejoin:round}
  .fluidfill{fill:#dbe8f2}
  .dim{stroke:#444;stroke-width:1.1;fill:none}
  .ext{stroke:#999;stroke-width:0.8;stroke-dasharray:3 2}
  .dimtxt{font-size:15px;fill:#222;text-anchor:middle;dominant-baseline:middle}
  .lab{font-size:16px;fill:#111;font-style:italic}
  .fluid{font-size:15px;fill:#1a4a72}
  .gate{stroke:#111;stroke-width:9;stroke-linecap:butt}
  .gate2{stroke:#f2c14e;stroke-width:5;stroke-linecap:butt}
  .force{stroke:#b3261e;stroke-width:2.2;fill:none}
  .cap{font-size:13px;fill:#555}
  .cl{stroke:#666;stroke-width:1;stroke-dasharray:9 3 2 3;fill:none}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#444"/></marker>
  <marker id="fh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#b3261e"/></marker>
</defs>
<rect x="118.0" y="170.0" width="208.0" height="182.0" class="fluidfill"/>
<line x1="55.6" y1="170.0" x2="445.6" y2="170.0" stroke="#1a4a72" stroke-width="1.6"/>
<path d="M 118.0,66.0 L 118.0,352.0 L 326.0,352.0 L 326.0,66.0" class="wall"/>
<line x1="118.0" y1="66.0" x2="326.0" y2="66.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="7 4"/>
<line x1="222.0" y1="27.0" x2="222.0" y2="388.4" class="cl"/>
<g transform="translate(393.6,170.0)"><path d="M-11,-13 L11,-13 L0,-1 z" fill="none" stroke="#1a4a72" stroke-width="1.6"/><line x1="-9" y1="3" x2="9" y2="3" stroke="#1a4a72" stroke-width="1.4"/><line x1="-5.5" y1="7" x2="5.5" y2="7" stroke="#1a4a72" stroke-width="1.4"/></g>
<text x="393.6" y="219.4" class="fluid" text-anchor="middle">Water</text>
<line x1="68.6" y1="66.0" x2="68.6" y2="170.0" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="118.0" y1="66.0" x2="68.6" y2="66.0" class="ext"/>
  <line x1="118.0" y1="170.0" x2="68.6" y2="170.0" class="ext"/>
  <text x="57.7" y="118.0" class="dimtxt" transform="rotate(90.0 57.7 118.0)">4 cm</text>
<line x1="68.6" y1="170.0" x2="68.6" y2="352.0" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="118.0" y1="170.0" x2="68.6" y2="170.0" class="ext"/>
  <line x1="118.0" y1="352.0" x2="68.6" y2="352.0" class="ext"/>
  <text x="57.7" y="261.0" class="dimtxt" transform="rotate(90.0 57.7 261.0)">7 cm</text>
<line x1="118.0" y1="401.4" x2="326.0" y2="401.4" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="118.0" y1="352.0" x2="118.0" y2="401.4" class="ext"/>
  <line x1="326.0" y1="352.0" x2="326.0" y2="401.4" class="ext"/>
  <text x="222.0" y="412.3" class="dimtxt" transform="rotate(0.0 222.0 412.3)">d = 8 cm</text>
<text x="48" y="450" class="cap">MEC 3104 CAT 1, 19 Aug 2025 — Q3. Can floating in water; 4 cm freeboard, 7 cm draught, open top.</text>
