<title>SCE 3104 CAT 1 (14 Aug 2024) — Q4b: rectangular sharp-crested weir</title>
<desc>Left: side elevation. Water standing at a head H above the crest of a weir wall of height D above the bed spills over as a nappe. Right: front elevation looking at the weir opening of width b, with an elemental horizontal strip of thickness dz at depth z below the free surface — the strip that the integral dQ = C*b*sqrt(2gz) dz sums over. In this question b = 1 m and H = 70 cm.</desc>
