<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="Georgia, 'Times New Roman', serif">
<title>SCE 3104 CAT 1 (14 Aug 2024) — Q3: cylindrical fluid element on a streamline (Euler's equation)</title>
<desc>A cylindrical fluid element of cross-sectional area dA and length ds lies along a curved streamline s, inclined so that its rise over the length ds is dz. Pressure p acts on the upstream face and p + (dp/ds)ds on the downstream face; the weight rho*g*dA*ds acts vertically downward; theta is the angle between the element axis and the vertical, so dz/ds = cos(theta). Vertical coordinate z is upward.</desc>
<style>
  .wall{fill:none;stroke:#1a1a1a;stroke-width:2.6;stroke-linejoin:round}
  .thin{fill:none;stroke:#1a1a1a;stroke-width:1.6}
  .fluidfill{fill:#dbe8f2}
  .dim{stroke:#444;stroke-width:1.1;fill:none}
  .ext{stroke:#999;stroke-width:0.8;stroke-dasharray:3 2}
  .dimtxt{font-size:15px;fill:#222;text-anchor:middle;dominant-baseline:middle}
  .lab{font-size:16px;fill:#111;font-style:italic}
  .labn{font-size:15px;fill:#111}
  .fluid{font-size:15px;fill:#1a4a72}
  .force{stroke:#b3261e;stroke-width:2.2;fill:none}
  .flow{stroke:#1a4a72;stroke-width:1.6;fill:none}
  .hatch{stroke:#1a1a1a;stroke-width:1.2}
  .cap{font-size:13px;fill:#555}
  .dash{stroke:#1a4a72;stroke-width:1.3;stroke-dasharray:9 7;fill:none}
</style>
